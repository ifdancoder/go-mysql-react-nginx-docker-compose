services:
  backend:
    container_name: go-backend
    user: ${UID}:${GID}
    build:
      context: ./backend
    ports:
      - 8080:8080
    volumes:
      - ./backend/start.sh:/start.sh
      - ./backend/module:/app
      - ./backend/build-cache:/.cache
    networks:
      - app-network
    command: /start.sh

  mysql:
    container_name: mysql
    image: mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/dumps:/docker-entrypoint-initdb.d/
    networks:
      - app-network

  frontend:
    image: node:18-alpine
    container_name: react-frontend
    volumes:
      - ./frontend:/app
    working_dir: /app
    command: >
      sh -c "npm init react-app . || (npm ci && npm start)"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - REACT_APP_API_URL=http://localhost/api
      - NODE_ENV=development
    ports:
      - "3000:3000"
    networks:
      - app-network

  nginx:
    build:
      context: ./nginx
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      NGINX_HOST: ${NGINX_HOST}
    command: >
      sh -c "/etc/nginx/start.sh"
    volumes:
      - ./nginx/start.sh:/etc/nginx/start.sh
      - ./nginx/conf.d/dev.conf:/etc/nginx/conf.d/default.conf.template
      - ./backend:/backend
      - ./frontend:/frontend
    networks:
      - app-network

volumes:
  mysql-data:

networks:
  app-network:
    driver: bridge
